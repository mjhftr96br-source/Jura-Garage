/* ---------- Ansicht: Statistik ---------- */
function sureOf(it){ const p = S.progress.get(it.id); return !!(p && p.lastGrade>=3 && !p.leech); }
function tierStats(){
  const all = [...S.items.values()].filter(i=>!i.fallsumme || true);
  const out = {};
  for(const t of [1,2,3,4]){ const l = all.filter(i=>tierOf(i)===t); out[t] = {n:l.length, sure:l.filter(sureOf).length, seen:l.filter(i=>S.progress.has(i.id)).length}; }
  return out;
}
function projection(){
  const all = [...S.items.values()].filter(i=>tierOf(i)<=2);
  const n = all.length, sure = all.filter(sureOf).length, left = daysToExam();
  const t = today(), d14 = addDays(t,-14);
  const recent = all.filter(i=>{ const p=S.progress.get(i.id); return p && p.sure && p.sure>=d14; }).length;
  const first = all.map(i=>(S.progress.get(i.id)||{}).sure).filter(Boolean).sort()[0];
  const span = first ? Math.min(14, Math.max(3, diffDays(first, t)+1)) : 0;
  let rate = span && recent ? recent/span : 0, basis = "gemessen";
  if(!rate){
    const rev = Object.entries(S.log.days).filter(([d])=>d>=d14).reduce((a,[,v])=>a+v,0);
    rate = (rev/14)*0.35*(n? (n-sure)/n : 0); basis = "geschätzt aus deinem Tagespensum";
  }
  const proj = n ? Math.min(100, (sure + rate*left)/n*100) : 0;
  const need = left>0 ? Math.max(0, (0.9*n - sure)/left) : 0;
  return {n, sure, left, rate, basis, pct: n?sure/n*100:0, proj, need};
}
function projChart(P){
  const W=640,H=210,L=40,R=14,T=14,B=26;
  const x = f => L+(W-L-R)*f, y = v => T+(H-T-B)*(1-v/100);
  const line = `M${x(0)},${y(P.pct)} L${x(1)},${y(P.proj)}`;
  const tick = [0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hochrechnung Wissensstand Tier 1 und 2 bis zum Examen">${tick}
    <line x1="${L}" x2="${W-R}" y1="${y(90)}" y2="${y(90)}" stroke="var(--g3)" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="${L+8}" y="${y(90)-6}" font-size="12" font-weight="600" fill="var(--g3)">Ziel 90 %</text>
    <path d="${line}" stroke="var(--acc-ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="1 7"/>
    <circle cx="${x(0)}" cy="${y(P.pct)}" r="5" fill="var(--acc-ink)"/><circle cx="${x(1)}" cy="${y(P.proj)}" r="5" fill="none" stroke="var(--acc-ink)" stroke-width="2.5"/>
    <text x="${x(0)+8}" y="${y(P.pct)-8}" font-size="12" fill="var(--ink)" font-weight="600" stroke="var(--paper)" stroke-width="4" paint-order="stroke">heute ${Math.round(P.pct)} %</text>
    <text x="${x(1)-10}" y="${P.proj>80?y(P.proj)+22:y(P.proj)-10}" text-anchor="end" font-size="12" fill="var(--ink)" font-weight="600" stroke="var(--paper)" stroke-width="4" paint-order="stroke">Examen ${Math.round(P.proj)} %</text>
    <text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)">heute</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${toDate(examDate()).toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"})}</text></svg>`;
}
function vWissen(){
  const T = tierStats(), P = projection();
  const goalOk = P.pct>=90;
  const tc = t => { const x=T[t], pc = x.n? x.sure/x.n*100 : 0, goal = t<=2;
    return `<div class="tcard"><span class="tier t${t}">T${t}</span> <span class="small muted">${TIER_TXT[t].split(" · ")[1]}</span>
      <b class="big">${Math.round(pc)} %</b>
      <div class="goalbar"><i style="width:${pc}%;background:${goal?(pc>=90?"var(--g3)":"var(--acc)"):"var(--g4)"}"></i>${goal?`<span class="goalmark" style="left:90%" title="Ziel 90 %"></span>`:""}</div>
      <p class="small muted" style="margin:8px 0 0">${x.sure} von ${x.n} sicher, ${x.seen} schon gelernt${goal?". Ziel: 90 %":""}</p></div>`; };

  const exp = toDate(examDate()).toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"});
  return `<h2>Wissensstand und Hochrechnung</h2>

    <div class="row" style="margin-top:10px"><label class="small muted" for="examdate">Examenstermin</label><input type="date" id="examdate" value="${esc(examDate())}" style="padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)"></div>

async function doExport(){
  const data = JSON.stringify({app:"examenskartei", version:1, exported:now(), items:[...S.items.values()], progress:Object.fromEntries(S.progress), settings:S.settings, log:S.log}, null, 1);
  const name = "examenskartei-"+today()+".json";
  const mobile = /iPhone|iPad|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Mac/.test(navigator.platform||""));
  try{
    const file = new File([data], name, {type:"application/json"});
    if(mobile && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e && e.name==="AbortError") return; }
    }
    const url = URL.createObjectURL(file); const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000); toast("Gesichert"); return;
  }catch(e){}
  $("#exportbox").innerHTML = `<p class="small muted">Das Herunterladen ist hier nicht möglich. Kopiere den Text und speichere ihn als „${name}“.</p><textarea style="width:100%;min-height:120px;font-size:12px" readonly>${esc(data)}</textarea>`;
}
async function doImport(file, noStart){
  let d;
  try{ d = JSON.parse(await file.text()); if(!Array.isArray(d.items)) throw 0; }
  catch(e){ toast("Die Datei ist keine Sicherung der Examenskartei."); return; }
  try{
    toast("Importiere "+d.items.length+" Einträge …");
    await putItems(d.items.filter(it=>it && it.id && it.type));
    await putProgressMany(Object.entries(d.progress||{}));
    if(d.settings){ Object.assign(S.settings, d.settings); await saveSettings(); }
    if(d.log && d.log.days){ Object.entries(d.log.days).forEach(([k,v])=>S.log.days[k]=Math.max(S.log.days[k]||0,v)); await putMeta("log", S.log); }
    if(d.tagesabfrage && d.tagesabfrage.datum){
      const ids = d.items.filter(it=>it && it.id && it.type).map(it=>it.id);
      toast(ids.length+" Karten der Tagesabfrage übernommen");
      if(noStart){ render(); return; }
      const rest = ids.filter(x=>{ const it = S.items.get(x); return it && taPending(it); });
      if(!rest.length){ render(); return; }
      startSession(rest, {kind:"tages", key:d.tagesabfrage.datum, label:"Tagesabfrage "+toDate(d.tagesabfrage.datum).toLocaleDateString("de-DE",{day:"numeric",month:"long"})});
      return;
    }
    toast(d.items.length+" Einträge geladen"); render();
  }catch(e){ render(); }
}
async function doQuizlet(){
  const txt = $("#qz").value; const type = $("#qz-type").value; const area = $("#qz-area").value.trim();
  const rows = txt.split(/\r?\n/).map(l=>l.split("\t")).filter(r=>r.length>=2 && r[0].trim());
  if(!rows.length){ toast("Keine Karten erkannt. Zwischen Begriff und Definition muss ein Tab stehen."); return; }
  const list = rows.map(([a,...b])=>{
    const back = b.join(" ").trim();
    const it = type==="def" ? {id:uid("d"), type, term:a.trim(), definition:back, merkmale:[]} : {id:uid("k"), type, front:a.trim(), back};
    return Object.assign(it, {area, source:"Quizlet", tier:3, norms:[], tags:[], links:[], created:now()});
  });
  try{ await putItems(list); $("#qz").value = ""; toast(rows.length+" Karten importiert"); }catch(e){}
  render();
}

/* ---------- Ändern in der App: selbst oder per Claude ---------- */
const EDIT_FIELDS = {card:["front","back"], def:["term","definition","merkmale"], schema:["title","steps","hinweis"], case:["title","sachverhalt","kern","problems"]};
const EDIT_RULES = `Du überarbeitest einen Eintrag einer Lernkartei für das bayerische Erste Juristische Staatsexamen nach der Anweisung des Lernenden. Ändere nur, was die Anweisung verlangt oder was dafür nötig ist; Stil und Aufbau des Originals bleiben erhalten. Rechtlich Unsicheres kennzeichnest du im Feld text, statt zu raten; keine erfundenen Aktenzeichen oder Fundstellen. Antworte ausschließlich mit JSON ohne weiteren Text: {"text":"1–3 Sätze: was du geändert hast und warum","patch":{ nur geänderte Felder }}. Erlaubte Felder: front, back (Text) bei Karteikarten; term, definition (Text), merkmale (Liste) bei Definitionen; title (Text), steps (Liste, Unterpunkte mit zwei Leerzeichen eingerückt), hinweis (Text) bei Schemata; title, sachverhalt (Text), kern (Liste), problems (Liste aus {"frage","antwort"}) bei Fällen; bei allen zusätzlich norms (Liste, z. B. "§ 35 BauGB") und tags (Liste). Gib geänderte Felder immer vollständig an, nicht nur den geänderten Teil.`;
function changeDialog(id){
  const it = S.items.get(id); if(!it) return;
  $("#layer").innerHTML = `<div class="overlay" data-act="closehelp"><div class="panel" style="max-width:620px">
    <div class="row"><h2 style="margin:0">Karte ändern</h2><span class="spacer"></span><button class="btn ghost" data-act="closehelp">Schließen</button></div>
    <p class="small muted" style="margin:6px 0 14px">${esc(titleOf(it)).slice(0,140)}</p>
    <div class="row"><button class="btn" data-act="selfedit" data-id="${esc(id)}">✎ Selbst bearbeiten</button></div>
    ${S.ai?`<h3>Oder Claude sagen, was geändert werden soll</h3>
    <div class="field"><textarea id="chgtext" style="min-height:90px" placeholder="z. B. „Ergänze die Gegenansicht“, „Rückseite kürzer, in Stichpunkten“, „Norm ist Art. 6 BayBO, nicht § 6“"></textarea></div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="chggo" data-act="aichange" data-id="${esc(id)}">Vorschlag von Claude</button><span class="small muted" id="chgstate">Claude schreibt einen Korrekturvorschlag; du übernimmst ihn mit einem Klick.</span></div>`:`<p class="small muted">Änderungen über Claude brauchen die Verbindung zu Supabase.</p>`}
  </div></div>`;
  setTimeout(()=>{ const t=$("#chgtext"); if(t) t.focus(); }, 30);
}
async function aiChange(id){
  const it = S.items.get(id); const ta = $("#chgtext"); const wish = (ta && ta.value || "").trim();
  if(!wish){ toast("Schreib oder diktiere zuerst, was geändert werden soll."); return; }
  const btn = $("#chggo"), st = $("#chgstate"); if(btn) btn.disabled = true; if(st) st.textContent = "Claude überarbeitet die Karte …";
  const fields = EDIT_FIELDS[it.type].concat(["norms","tags"]);
  const cur = {}; fields.forEach(k=>{ if(it[k]!=null) cur[k] = it[k]; });
  try{
    const txt = await aiStream([EDIT_RULES, "Typ: "+TYPES[it.type]+"\nRechtsgebiet: "+(it.area||"-")+"\nQuelle: "+(it.source||"-")+"\nAktueller Eintrag (JSON):\n"+JSON.stringify(cur)], [{role:"user", content:"Anweisung: "+wish}], {kind:"check", max_tokens:3000});
    const a = txt.indexOf("{"), b = txt.lastIndexOf("}"); if(a<0 || b<a) throw {code:"invalid_json"};
    let d; try{ d = JSON.parse(txt.slice(a,b+1)); }catch(e){ throw {code:"invalid_json"}; }
    const patch = {}; for(const [k,v] of Object.entries(d.patch||{})) if(fields.includes(k)) patch[k] = v;
    if(!Object.keys(patch).length){ if(st) st.textContent = d.text || "Claude hat nichts geändert."; if(btn) btn.disabled = false; return; }
    const c = clean(it); c.suggestion = {status:"offen", text:(d.text||"Änderung nach deiner Anweisung.")+"\n\nDeine Anweisung: "+wish, patch, quelle:"Claude in der App, "+new Date().toLocaleDateString("de-DE"), art:"auftrag"};
    await putItem(c); $("#layer").innerHTML = ""; toast("Vorschlag liegt oben auf der Karte"); render(); window.scrollTo({top:0, behavior:"smooth"});
  }catch(e){ if(st) st.textContent = errText(e); if(btn) btn.disabled = false; }
}

/* ---------- Spracheingabe (an jedem Schreibfeld) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
let rec = null, recEl = null, recBtn = null;
const micTargets = el => el.matches('textarea, input[type="search"], input[type="text"], input:not([type])') && !el.disabled && !el.readOnly && el.id!=="quick" && el.id!=="f-link" && !el.closest(".nomic");
function enhanceMics(root=document){
  if(!SR) return;
  root.querySelectorAll('textarea, input').forEach(el=>{
    if(el.dataset.mic || !micTargets(el)) return;
    el.dataset.mic = "1";
    const wrap = document.createElement("span"); wrap.className = "micwrap" + (el.tagName==="TEXTAREA" ? " ta" : " in");
    el.parentNode.insertBefore(wrap, el); wrap.appendChild(el);
    const b = document.createElement("button"); b.type = "button"; b.className = "micbtn"; b.innerHTML = MIC_SVG;
    b.title = "Spracheingabe (Diktat)"; b.setAttribute("aria-label", "Spracheingabe starten");
    b.addEventListener("mousedown", ev=>ev.preventDefault());
    b.addEventListener("click", ev=>{ ev.preventDefault(); ev.stopPropagation(); toggleMic(el, b); });
    wrap.appendChild(b);
  });
}
function stopMic(){ if(rec){ try{ rec.stop(); }catch(e){} } }
function toggleMic(el, btn){
  if(rec && recEl===el){ stopMic(); return; }
  stopMic();
  const r = new SR(); r.lang = "de-DE"; r.continuous = true; r.interimResults = true;
  const start = el.selectionStart!=null ? el.selectionStart : el.value.length;
  const before = el.value.slice(0, start), after = el.value.slice(el.selectionEnd!=null ? el.selectionEnd : start);
  const sep = before && !/\s$/.test(before) ? " " : "";
  let finalText = "";
  r.onresult = e=>{
    let interim = "";
    for(let i=e.resultIndex; i<e.results.length; i++){ const t = e.results[i][0].transcript; if(e.results[i].isFinal) finalText += t; else interim += t; }
    const spoken = (finalText + interim).replace(/\s+/g," ").trim();
    if(!document.body.contains(el)) return;
    el.value = before + sep + spoken + after;
    const pos = (before + sep + spoken).length; try{ el.setSelectionRange(pos, pos); }catch(x){}
    el.dispatchEvent(new Event("input", {bubbles:true}));
  };
  r.onerror = e=>{ if(e.error==="not-allowed" || e.error==="service-not-allowed") toast("Mikrofon nicht freigegeben. Erlaube den Zugriff in den Browser-Einstellungen."); else if(e.error!=="no-speech" && e.error!=="aborted") toast("Spracheingabe unterbrochen ("+e.error+")."); };
  r.onend = ()=>{ if(recBtn) recBtn.classList.remove("on"); if(rec===r){ rec = null; recEl = null; recBtn = null; } };
  rec = r; recEl = el; recBtn = btn; btn.classList.add("on"); btn.setAttribute("aria-label","Spracheingabe beenden");
  try{ r.start(); el.focus(); }catch(e){ rec = null; btn.classList.remove("on"); toast("Spracheingabe konnte nicht starten."); }
}
new MutationObserver(muts=>{ if(!SR) return; for(const m of muts) for(const n of m.addedNodes) if(n.nodeType===1){ if(n.matches && n.matches("textarea,input")) enhanceMics(n.parentNode||document); else enhanceMics(n); } })
  .observe(document.body, {childList:true, subtree:true});

/* ---------- Start ---------- */
async function startData(sess){
  S.user = sess.user; S.needLogin = false; S.ready = false; render();
  try{ await loadAll(); }
  catch(e){ S.stale = true; toast(isAuthErr(e) ? "Deine Anmeldung ist abgelaufen. Bitte melde dich neu an." : "Die Kartei konnte nicht geladen werden. Prüfe die Internetverbindung."); }
  S.ai = true; S.ready = true; render(); subscribe();
}
async function boot(){
  render();
  if(!CONFIGURED || !window.supabase){
    S.mode = "lokal"; lsLoad(); loadSavedSess(null); S.ready = true; render();
    if(CONFIGURED) toast("Die Datenbank-Bibliothek konnte nicht geladen werden. Prüfe die Internetverbindung.");
    return;
  }
  S.mode = "konto";
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}});
  S.sb.auth.onAuthStateChange((ev)=>{
    if(ev==="SIGNED_OUT"){ S.user = null; S.ai = false; S.items = new Map(); S.progress = new Map(); session = null; S.needLogin = true; S.ready = true; render(); }
  });
  const {data} = await S.sb.auth.getSession();
  if(!data || !data.session){ S.needLogin = true; S.ready = true; render(); return; }
  await startData(data.session);
  document.addEventListener("visibilitychange", async ()=>{
    if(document.visibilityState!=="visible" || !S.user || Date.now()-lastLoad < 30000) return;
    try{ await loadAll(); refresh(); }catch(e){}
  });
}
boot();
</script>
