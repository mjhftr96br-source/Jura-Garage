<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examenskartei</title>
<meta name="theme-color" content="#D4B06A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#3A3224" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kartei">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EDDF; --paper:#FFFDF8; --ink:#2B2720; --muted:#6F6757; --line:#E0D5BE; --soft:#F8F3E8;
  --acc:#C99A3E; --acc-ink:#7A5A1E; --acc-soft:#EFE2C4; --on-acc:#2B2720; --head:#D4B06A; --head-ink:#2B2720;
  --c-def:#4E6E8E; --c-card:#5E7F50; --c-case:#A65B45; --c-schema:#7C6082;
  --chat:#E7E9E0; --chat-ink:#2F3A2E; --chat-line:#CDD3C3; --bubble:#FCFBF7;
  --ok:#5E7F50; --ok-soft:#E5ECDD; --warn:#87621F; --warn-soft:#F3E7CC;
  --g1:#A65B45; --g2:#A97C2E; --g3:#5E7F50; --g4:#4E6E8E;
  --sans:"Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --serif:"Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1914; --paper:#24211B; --ink:#EDE6D6; --muted:#ABA28E; --line:#3A3529; --soft:#2B2820;
    --acc:#CFA552; --acc-ink:#DDBB75; --acc-soft:#3A3122; --on-acc:#211D15; --head:#3A3224; --head-ink:#E2C68A;
    --c-def:#8AA5C0; --c-card:#9AB487; --c-case:#CF8F79; --c-schema:#AE95B4;
    --chat:#20241F; --chat-ink:#D7DDD0; --chat-line:#343B32; --bubble:#2A3028;
    --ok:#9AB487; --ok-soft:#262D22; --warn:#DDBB75; --warn-soft:#332B1E;
    --g1:#CF8F79; --g2:#DDBB75; --g3:#9AB487; --g4:#8AA5C0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1914; --paper:#24211B; --ink:#EDE6D6; --muted:#ABA28E; --line:#3A3529; --soft:#2B2820;
  --acc:#CFA552; --acc-ink:#DDBB75; --acc-soft:#3A3122; --on-acc:#211D15; --head:#3A3224; --head-ink:#E2C68A;
  --c-def:#8AA5C0; --c-card:#9AB487; --c-case:#CF8F79; --c-schema:#AE95B4;
  --chat:#20241F; --chat-ink:#D7DDD0; --chat-line:#343B32; --bubble:#2A3028;
  --ok:#9AB487; --ok-soft:#262D22; --warn:#DDBB75; --warn-soft:#332B1E;
  --g1:#CF8F79; --g2:#DDBB75; --g3:#9AB487; --g4:#8AA5C0;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* Kopfzeile */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink);border-bottom:1px solid color-mix(in srgb,var(--head-ink) 18%,transparent)}
.topin{display:flex;align-items:center;gap:18px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;white-space:nowrap}
.brand b{font:600 19px/1 var(--serif);letter-spacing:-.01em}
.brand span{color:var(--head-ink);font:600 28px/1 var(--serif)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:8px 11px;border-radius:7px;text-decoration:none;color:var(--head-ink);opacity:.72;font-weight:500;white-space:nowrap}
nav.tabs a:hover{opacity:1;background:color-mix(in srgb,var(--head-ink) 9%,transparent)}
nav.tabs a[aria-current="page"]{opacity:1;font-weight:600;background:color-mix(in srgb,var(--head-ink) 12%,transparent);box-shadow:inset 0 -2px 0 var(--head-ink)}
.qs{position:relative;width:230px;flex:none}
.themebtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--head-ink) 25%,transparent);background:color-mix(in srgb,var(--head-ink) 7%,transparent);color:var(--head-ink);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:500;white-space:nowrap}
.themebtn:hover{background:color-mix(in srgb,var(--head-ink) 14%,transparent)}
@media (max-width:1240px){.themebtn span{display:none}}
.qs input{width:100%;padding:8px 12px 8px 32px;border:1px solid transparent;border-radius:8px;background:var(--paper);color:var(--ink)}
.qs svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);z-index:1}
.qs kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
@media (max-width:820px){ .qs{display:none} .topin{gap:10px} }

main{padding:26px 0 70px}
h1{font:700 30px/1.15 var(--serif);letter-spacing:-.01em;margin:0 0 6px}
h2{font:700 20px/1.25 var(--serif);margin:28px 0 10px}
h3{font:600 15px/1.3 var(--sans);margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 20px;max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:13px}
kbd{font:500 11px/1 var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--muted);background:var(--paper)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--acc);border-color:color-mix(in srgb,var(--acc) 70%,var(--ink));color:var(--on-acc);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{padding:12px 20px;font-size:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--acc-ink);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}

/* Heute */
.today{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.today{grid-template-columns:1fr}}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--paper);cursor:pointer;font-weight:500;user-select:none}
.chip[aria-pressed="true"]{border-color:var(--tc,var(--ink));background:var(--tc,var(--ink));color:var(--paper)}
.chip[aria-pressed="true"] .dot{background:var(--paper)}
.chip[aria-pressed="false"] .dot{background:var(--tc)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75}
.slider{display:flex;align-items:center;gap:14px;margin:4px 0 6px}
.slider input[type=range]{flex:1;accent-color:var(--acc-ink)}
.slider output{font:600 28px/1 var(--serif);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{background:var(--paper);padding:14px 16px}
.facts b{display:block;font:600 24px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.facts span{color:var(--muted);font-size:13px}

/* Karte */
.study{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:22px;align-items:start}
@media (max-width:900px){.study{grid-template-columns:1fr}}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.sheet{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:4px 12px 12px 4px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,25,40,.35);padding:26px 28px 26px 34px;min-height:300px}
.sheet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--tc,var(--acc));border-radius:4px 0 0 4px}
.sheet{border-top:3px solid var(--tc,var(--acc))}
.t-def{--tc:var(--c-def)} .t-card{--tc:var(--c-card)} .t-case{--tc:var(--c-case)} .t-schema{--tc:var(--c-schema)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tc)}
.sheet .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px;margin-bottom:14px}
.typetag{font-weight:600;color:var(--tc)}
.q{font:600 22px/1.35 var(--serif);margin:0 0 6px;max-width:62ch}
.prose{font:400 17px/1.6 var(--serif);max-width:68ch}
.prose p{margin:0 0 .7em}
.answer{border-top:1px dashed var(--line);margin-top:20px;padding-top:18px}
.margin-norms{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.norm{display:inline-block;font:600 12.5px/1 var(--sans);color:var(--acc-ink);background:var(--acc-soft);padding:5px 8px;border-radius:5px;text-decoration:none;white-space:nowrap;cursor:pointer;border:0}
.tag{display:inline-block;font-size:12.5px;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:999px;cursor:pointer;background:transparent}
.rel{display:inline-flex;gap:3px;align-items:center}
.rel i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.rel i.on{background:var(--acc-ink)}
ol.probs{padding-left:1.2em;margin:8px 0}
ol.schema{padding-left:0;margin:8px 0;list-style:none;counter-reset:s}
ol.schema li{margin:0 0 6px;padding-left:calc(var(--lv,0)*22px)}
ol.schema li.l0{font-weight:600;margin-top:10px}
ol.probs li{margin:0 0 12px}
ol.probs b{font-weight:600}
ul.kern{margin:8px 0;padding-left:1.2em}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.grades button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 6px;cursor:pointer;text-align:center}
.grades button b{display:block;font-weight:600}
.grades button span{font-size:12.5px;color:var(--muted)}
.grades button kbd{margin-left:4px}
.grades button[data-g="1"] b{color:var(--g1)} .grades button[data-g="2"] b{color:var(--g2)}
.grades button[data-g="3"] b{color:var(--g3)} .grades button[data-g="4"] b{color:var(--g4)}
.grades button:hover{border-color:var(--muted)}
.grades button.rec{outline:2px solid var(--ok);outline-offset:1px}
@media (max-width:520px){.grades{grid-template-columns:repeat(2,1fr)} .sheet{padding:22px 18px 22px 26px}}
.reveal{margin-top:22px}

.notice{border-radius:10px;padding:14px 16px;margin:0 0 16px;border:1px solid}
.notice.fix{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.notice.fix h4{margin:0 0 6px;font:600 14px/1.3 var(--sans);color:var(--warn)}
.notice.fix .row{margin-top:10px}
.notice.info{background:var(--soft);border-color:var(--line)}

.write textarea{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);font:400 15.5px/1.6 var(--serif);resize:vertical}
.verdict{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--soft)}
.verdict ul{list-style:none;padding:0;margin:8px 0 0}
.verdict li{padding:3px 0 3px 22px;position:relative}
.verdict li::before{position:absolute;left:0;font-weight:700}
.verdict li.y::before{content:"✓";color:var(--ok)}
.verdict li.n::before{content:"✗";color:var(--g1)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--muted)}
.switch input{accent-color:var(--acc-ink);width:16px;height:16px}

/* Chat */
.chat{background:var(--chat);color:var(--chat-ink);border:1px solid var(--chat-line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 140px);min-height:320px;position:sticky;top:76px}
@media (max-width:900px){.chat{position:static;max-height:none}}
.chat header{padding:14px 16px 10px;border-bottom:1px solid var(--chat-line)}
.chat header b{display:block;font-weight:600}
.chat header span{font-size:12.5px;opacity:.75}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--chat-ink);color:var(--chat);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--bubble);border-bottom-left-radius:4px}
.msg.err{background:transparent;border:1px dashed var(--chat-line);font-size:13px}
.chat .starters{display:flex;flex-wrap:wrap;gap:6px}
.chat .starters button{border:1px solid var(--chat-line);background:transparent;border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;color:inherit}
.compose{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--chat-line)}
.compose textarea{flex:1;resize:none;min-height:42px;max-height:140px;border:1px solid var(--chat-line);border-radius:10px;padding:10px;background:var(--bubble);font-size:14.5px}
.compose .btn{background:var(--chat-ink);color:var(--chat);border-color:var(--chat-ink);align-self:flex-end}

/* Listen */
.list{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer}
.item:first-child{border-top:0}
.item:hover{background:var(--soft)}
.item .t{font:600 16px/1.4 var(--serif)}
.item .s{color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .k{font-size:12.5px;font-weight:600;color:var(--muted)}
.item{border-left:4px solid var(--tc)} .item .k{color:var(--tc)}
.item .r{text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
@media (max-width:600px){.item{grid-template-columns:1fr}.item .r{text-align:left}}
mark{background:color-mix(in srgb,var(--acc) 55%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.filters select,.filters input,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px}
.bigsearch{width:100%;font:500 20px/1.3 var(--serif);padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);margin-bottom:18px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

/* Detail */
.detail{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:22px;align-items:start}
@media (max-width:900px){.detail{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}

/* Formular */
.form{display:grid;gap:14px;max-width:760px}
.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.field small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.field input,.field select,.field textarea{width:100%}
.field textarea{min-height:90px;resize:vertical;font:400 15px/1.55 var(--serif)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.two{grid-template-columns:1fr}}
.picker{position:relative}
.picker .drop{position:absolute;left:0;right:0;top:100%;z-index:4;background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:240px;overflow:auto;box-shadow:0 12px 30px -16px rgba(0,0,0,.4)}
.picker .drop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.picker .drop button:hover{background:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips span{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.chips button{border:0;background:var(--soft);border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1}

/* Statistik */
.areas{display:flex;flex-direction:column;gap:12px}
.area .row{justify-content:space-between}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin-top:6px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.forecast{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.forecast div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.forecast i{display:block;width:100%;max-width:30px;background:var(--ink);border-radius:3px 3px 0 0;min-height:2px}
.forecast div:first-child i{background:var(--acc)}
.forecast span{font-size:11px;color:var(--muted);white-space:nowrap}
.forecast em{font-style:normal;font-size:11.5px;font-variant-numeric:tabular-nums}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,12,18,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.overlay .panel{max-width:520px;width:100%;max-height:85vh;overflow:auto}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90vw}
.status{font-size:12.5px;color:var(--muted)}
.done{text-align:center;padding:50px 20px}
.done b{font:600 44px/1 var(--serif);display:block;margin-bottom:8px}
body.locked nav.tabs, body.locked .qs{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap topin">
    <a class="brand" href="#heute" aria-label="Examenskartei, zu Heute" title="Examenskartei"><span>§</span></a>
    <nav class="tabs" id="tabs">
      <a href="#heute">Heute</a>
      <a href="#suche">Suche</a>
      <a href="#bibliothek">Bibliothek</a>
      <a href="#normen">Normen</a>
      <a href="#problemkarten">Problemkarten</a>
      <a href="#pruefung">Prüfungsmodus</a>
      <a href="#statistik">Statistik</a>
      <a href="#daten">Daten</a>
    </nav>
    <button class="themebtn" id="themebtn" data-act="theme" type="button"></button>
    <div class="qs">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

const clean = o => JSON.parse(JSON.stringify(o));
const queues = new Map();
function serial(key, fn){ const prev = queues.get(key)||Promise.resolve(); const next = prev.catch(()=>{}).then(fn); queues.set(key,next); return next; }
const isAuthErr = e => e && (e.status===401 || e.code==="PGRST301" || /jwt|token/i.test(e.message||""));
async function sbRun(key, fn){
  const once = async () => { const r = await fn(); if(r && r.error) throw r.error; return r; };
  try{ return await serial(key, once); }
  catch(e){
    if(!isAuthErr(e)){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); try{ return await serial(key, once); }catch(e2){ e = e2; } }
    toast(isAuthErr(e) ? "Deine Anmeldung ist abgelaufen. Bitte melde dich neu an." : !navigator.onLine ? "Keine Internetverbindung. Die Änderung wurde nicht gespeichert." : "Speichern fehlgeschlagen. Bitte noch einmal versuchen.");

}
const now = () => new Date().toISOString();
const rowOf = (id, data) => ({user_id:S.user.id, id, data:clean(data), updated_at:now()});
async function putItem(it){

}
async function putItems(list){

async function saveSettings(){ await putMeta("settings", S.settings); }
async function bumpLog(){

}
async function fetchAll(table){
  const out = [], step = 1000;
  for(let from=0;; from+=step){
    const {data, error} = await S.sb.from(table).select("*").range(from, from+step-1);
    if(error) throw error;
    out.push(...data); if(data.length < step) break;
  }
  return out;
}
let lastLoad = 0;
async function loadAll(){

let rtTimer;
const later = () => { clearTimeout(rtTimer); rtTimer = setTimeout(()=>{ if(S.ready) refresh(); }, 150); };
function subscribe(){
  try{
    const ch = S.sb.channel("kartei-"+S.user.id);
    for(const t of ["items","progress","meta"]){
      ch.on("postgres_changes", {event:"*", schema:"public", table:t}, p=>{
        const n = p.new || {}, o = p.old || {};
        if(p.eventType==="DELETE"){ if(t==="items") S.items.delete(o.id); if(t==="progress") S.progress.delete(o.id); later(); return; }
        if(n.user_id && n.user_id!==S.user.id) return;

        else if(n.key==="settings") Object.assign(S.settings, n.data||{});
        else if(n.key==="log"){ const days = Object.assign({}, (n.data||{}).days||{}); for(const [k,v] of Object.entries(S.log.days)) days[k] = Math.max(days[k]||0, v); S.log = {days}; }
        later();
      });
    }
    ch.subscribe();
  }catch(e){}
}

/* ---------- Claude über die Supabase-Funktion ---------- */
async function aiCall(body, signal){
  if(!navigator.onLine) throw {code:"offline"};
  const {data} = await S.sb.auth.getSession();
  const sess = data && data.session; if(!sess) throw {code:"auth"};
  let r;
  try{
    r = await fetch(CFG.supabaseUrl.replace(/\/+$/,"")+"/functions/v1/"+(CFG.claudeFunction||"claude"), {
      method:"POST", signal,
      headers:{"Content-Type":"application/json", "Authorization":"Bearer "+sess.access_token, "apikey":CFG.supabaseKey},
      body:JSON.stringify(body)});
  }catch(e){ if(e && e.name==="AbortError") throw {code:"cancelled"}; throw {code:"network"}; }
  if(!r.ok){
    let d = {}; try{ d = await r.json(); }catch(e){}
    const detail = String(d.detail||d.error||d.message||"");
    const code = r.status===404 ? "no_function" : r.status===401 ? "auth" : r.status===403 ? "forbidden" : r.status===429 ? "rate_limited"
      : d.error==="no_key" ? "no_key" : /credit|balance|billing/i.test(detail) ? "no_credit" : /authentication|api.key|x-api-key/i.test(detail) ? "bad_key" : "failed";
    throw {code, status:r.status, detail};
  }
  return r;
}
function normTurns(turns){
  const out = [];
  for(const t of turns){ if(!t.content) continue; const last = out[out.length-1];
    if(last && last.role===t.role) last.content += "\n\n"+t.content; else out.push({role:t.role, content:t.content}); }
  while(out.length && out[0].role!=="user") out.shift();
  return out;
}
/* Gespeicherte KI-Antworten (auf diesem Gerät): gleiche Frage zur unveränderten Karte kostet keinen neuen Aufruf */
const AI_CACHE_KEY = "examenskartei-ki-cache", AI_CACHE_MAX = 400;
function hashStr(t){ let h = 0x811c9dc5; for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h>>>0).toString(36)+t.length.toString(36); }
const normQ = t => fold(t).replace(/[^\p{L}\p{N}§]+/gu," ").trim();
function cacheGet(k){ try{ const m = JSON.parse(localStorage.getItem(AI_CACHE_KEY)||"{}"); return m[k] ? m[k].v : undefined; }catch(e){ return undefined; } }
function cachePut(k, v){
  try{ const m = JSON.parse(localStorage.getItem(AI_CACHE_KEY)||"{}"); m[k] = {v, t:Date.now()};
    const ks = Object.keys(m); if(ks.length > AI_CACHE_MAX) ks.sort((a,b)=>m[a].t-m[b].t).slice(0, ks.length-AI_CACHE_MAX).forEach(x=>delete m[x]);
    localStorage.setItem(AI_CACHE_KEY, JSON.stringify(m)); }catch(e){}
}
const CHAT_RULES = "Du bist Repetitor für das bayerische Erste Juristische Staatsexamen und hilfst beim Lernen mit einer Kartei. Antworte auf Deutsch, knapp (höchstens 6 Sätze, außer es wird ausdrücklich mehr verlangt) und examensnah. Nenne die einschlägigen Normen und bei Streitständen die herrschende Meinung. Ist die Karte fehlerhaft oder unvollständig, weise sachlich darauf hin.";
const GRADE_RULES = 'Du korrigierst Definitionen für das bayerische Erste Juristische Staatsexamen. Prüfe, ob jedes Kernmerkmal der Musterdefinition sinngemäß in der Antwort enthalten ist; der Wortlaut muss nicht übereinstimmen. Antworte ausschließlich mit JSON ohne weiteren Text: {"merkmale":[{"merkmal":"…","erfuellt":true,"hinweis":"nur wenn nicht erfüllt, höchstens 10 Wörter"}],"gesamt":"vollständig|teilweise|unzureichend","empfehlung":"Nochmal|Schwer|Gut|Leicht","kommentar":"ein Satz"}';
async function aiStream(system, turns, opts={}){
  const r = await aiCall({kind:"chat", system, messages:normTurns(turns).slice(-6), stream:true, max_tokens:700}, opts.signal);
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "", text = "";
  try{
    for(;;){
      const {value, done} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true}).replace(/\r/g,"");
      let i;
      while((i = buf.indexOf("\n\n")) >= 0){
        const evt = buf.slice(0,i); buf = buf.slice(i+2);
        const line = evt.split("\n").find(l=>l.startsWith("data:")); if(!line) continue;
        let d; try{ d = JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
        if(d.type==="content_block_delta" && d.delta && d.delta.type==="text_delta"){ text += d.delta.text; opts.onText && opts.onText(text); }
        else if(d.type==="error") throw {code:/overload/i.test(JSON.stringify(d.error||""))?"rate_limited":"failed"};
      }
    }
  }catch(e){
    if(e && e.name==="AbortError") throw {code:"cancelled", text};
    throw Object.assign({code:"failed"}, e && e.code ? e : {}, {text});
  }
  return text;
}
async function aiJson(prompt){
  const r = await aiCall({kind:"grade", system:[GRADE_RULES], messages:[{role:"user", content:prompt}], stream:false, max_tokens:400});
  const d = await r.json(); const t = String(d.text||"");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if(a<0 || b<a) throw {code:"invalid_json"};
  try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ throw {code:"invalid_json"}; }
}

/* ---------- Wiederholungssystem ---------- */
// Klausurrelevanz streckt oder verkürzt jeden Abstand. Wenig relevante Karten kommen auch bei „Nochmal“ erst später wieder.
const REL_FACTOR = {5:0.8, 4:1, 3:1.3, 2:1.8, 1:2.5};
const AGAIN_DAYS = {5:1, 4:1, 3:3, 2:5, 1:8};
function schedule(prev, grade, rel){
  const p = Object.assign({ivl:0, ease:2.5, reps:0, lapses:0}, prev||{});
  rel = rel||3; const f = REL_FACTOR[rel]||1; let ivl;
  if(grade===1){ ivl = AGAIN_DAYS[rel]||3; p.ease = Math.max(1.3, p.ease-0.2); p.lapses++; }
  else if(grade===2){ ivl = (p.ivl ? Math.max(p.ivl*1.2, p.ivl+1) : 1.5) * f; p.ease = Math.max(1.3, p.ease-0.15); }
  else if(grade===3){ ivl = (p.ivl ? p.ivl*p.ease : 3) * f; }
  else { ivl = (p.ivl ? p.ivl*p.ease*1.3 : 6) * f; p.ease = Math.min(3.2, p.ease+0.15); }
  ivl = Math.min(365, Math.max(1, Math.round(ivl)));
  p.ivl = ivl; p.reps++; p.due = addDays(today(), ivl); p.last = today(); p.lastGrade = grade;
  p.leech = p.lapses >= 3;
  return p;
}
function priority(it){
  const p = S.progress.get(it.id), r = it.relevance||3;
  if(!p) return r*2 + 0.5;
  const over = Math.max(0, diffDays(p.due, today()));
  return r*2 + Math.min(p.lapses,5) + Math.min(over,30)*0.2 + (p.ease<2 ? 1.5 : 0);
}
const isDue = it => { const p = S.progress.get(it.id); return !p || p.due <= today(); };
const isNew = it => !S.progress.get(it.id);
function todayTarget(){ return S.settings.todayDate===today() && S.settings.todayN!=null ? S.settings.todayN : S.settings.base; }
const doneToday = () => S.log.days[today()]||0;
function fmtIvl(n){ return n===1 ? "morgen" : n<30 ? "in "+n+" Tagen" : n<365 ? "in "+Math.round(n/30)+" Mon." : "in 1 Jahr"; }

/* ---------- Hilfsfunktionen Einträge ---------- */
const titleOf = it => it.type==="card" ? it.front : it.type==="def" ? it.term : it.title;
const stepsText = it => (it.steps||[]).map(x=>x.replace(/^\s+/,"")).join(" ");
function bodyText(it){
  if(it.type==="card") return it.back||"";
  if(it.type==="def") return it.definition||"";
  if(it.type==="schema") return stepsText(it);
  return [it.sachverhalt, (it.kern||[]).join(" "), (it.problems||[]).map(p=>p.frage+" "+p.antwort).join(" ")].join(" ");
}
function hay(it){ return fold([titleOf(it), bodyText(it), (it.merkmale||[]).join(" "), (it.tags||[]).join(" "), (it.norms||[]).join(" "), it.source, it.area].join(" ")); }
function linksOf(id){
  const it = S.items.get(id); const out = new Set(it ? (it.links||[]) : []);
  for(const o of S.items.values()) if((o.links||[]).includes(id)) out.add(o.id);
  out.delete(id); return [...out].map(x=>S.items.get(x)).filter(Boolean);
}
function normIndex(){
  const m = new Map();
  for(const it of S.items.values()) for(const n of (it.norms||[])){ const k = n.trim(); if(!k) continue; if(!m.has(k)) m.set(k,[]); m.get(k).push(it); }
  return m;
}
const areas = () => [...new Set([...S.items.values()].map(i=>i.area).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"de"));
function relDots(r){ r=r||3; let h='<span class="rel" title="Klausurrelevanz: '+REL_TXT[r]+'">'; for(let i=1;i<=5;i++) h+='<i class="'+(i<=r?"on":"")+'"></i>'; return h+"</span>"; }
function paras(t){ return String(t||"").split(/\n{2,}|\n/).filter(x=>x.trim()).map(x=>"<p>"+esc(x)+"</p>").join(""); }
function hl(text, toks){
  let h = esc(text); if(!toks.length) return h;
  const f = fold(text); const marks = [];
  toks.forEach(t=>{ let i = f.indexOf(t); while(i>=0 && t){ marks.push([i,i+t.length]); i = f.indexOf(t,i+t.length); } });
  if(!marks.length) return h;
  marks.sort((a,b)=>a[0]-b[0]); const merged=[]; marks.forEach(m=>{ const l=merged[merged.length-1]; if(l && m[0]<=l[1]) l[1]=Math.max(l[1],m[1]); else merged.push(m.slice()); });
  let out="", pos=0; merged.forEach(([a,b])=>{ out+=esc(text.slice(pos,a))+"<mark>"+esc(text.slice(a,b))+"</mark>"; pos=b; }); return out+esc(text.slice(pos));
}
function snippet(text, toks, len=160){
  const f = fold(text); let i = -1; for(const t of toks){ const j=f.indexOf(t); if(j>=0 && (i<0||j<i)) i=j; }
  if(i<0 || text.length<=len) return text.length>len ? text.slice(0,len)+" …" : text;
  const s = Math.max(0, i-50); return (s>0?"… ":"")+text.slice(s, s+len)+(s+len<text.length?" …":"");
}
function itemRow(it, toks=[]){
  const p = S.progress.get(it.id);
  const due = !p ? "neu" : p.due<=today() ? "fällig" : "fällig "+fmtIvl(diffDays(today(),p.due)).replace("in ","in ");
  const sub = snippet(bodyText(it).replace(/\s+/g," "), toks);
  return `<a class="item t-${it.type}" href="#e-${esc(it.id)}"><span class="k">${TYPES[it.type]}</span>
    <span><div class="t">${hl(titleOf(it)||"(ohne Titel)", toks)}</div><div class="s">${hl(sub,toks)}</div></span>
    <span class="r">${esc(it.area||"")}<br>${relDots(it.relevance)} ${p&&p.leech?'<b style="color:var(--g1)">Problemkarte</b>':esc(due)}</span></a>`;
}

const ROUTES = ["heute","suche","bibliothek","normen","problemkarten","pruefung","statistik","daten","lernen","neu"];
function route(){ const h = decodeURIComponent(location.hash.slice(1)); return h || "heute"; }

function setNav(r){
  const base = r.startsWith("e-") ? "bibliothek" : r.startsWith("n-") ? "normen" : r==="lernen" ? (session&&session.exam?"pruefung":"heute") : r==="neu" ? "bibliothek" : r;
  document.querySelectorAll("#tabs a").forEach(a=>{ if(a.getAttribute("href")==="#"+base) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
}
function render(){
  const r = route(); setNav(r); const M = $("#main");
  document.body.classList.toggle("locked", !!S.needLogin);
  if(S.needLogin){ M.innerHTML = vLogin(); const m = $("#l-mail"); if(m && !m.value) m.focus(); return; }
  if(!S.ready){ M.innerHTML = '<p class="muted">Lade Kartei …</p>'; return; }
  if(r==="heute") M.innerHTML = vHeute();
  else if(r==="suche") { M.innerHTML = vSuche(); const i=$("#bigq"); i.value = searchQ; i.focus(); runSearch(); }
  else if(r==="bibliothek") M.innerHTML = vBib();
  else if(r==="normen") M.innerHTML = vNormen();
  else if(r==="problemkarten") M.innerHTML = vProblem();
  else if(r==="pruefung") M.innerHTML = vPruefung();
  else if(r==="statistik") M.innerHTML = vStats();
  else if(r==="daten") M.innerHTML = vDaten();
  else if(r==="lernen") M.innerHTML = vLernen();
  else if(r==="neu") M.innerHTML = vEdit(null);
  else if(r.startsWith("e-")) M.innerHTML = editing===r.slice(2) ? vEdit(S.items.get(r.slice(2))) : vDetail(r.slice(2));
  else if(r.startsWith("n-")) M.innerHTML = vNorm(r);
  else M.innerHTML = vHeute();
  afterRender();
}
function refresh(){
  const a = document.activeElement;
  if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $("#main").contains(a)) return;
  const r = route();
  if(r==="lernen" || r==="neu" || (r.startsWith("e-") && editing)) return;
  render();
}
function afterRender(){
  document.querySelectorAll(".msgs").forEach(m=>m.scrollTop=m.scrollHeight);
}

/* ---------- Ansicht: Anmeldung ---------- */
function vLogin(){
  return `<section class="panel" style="max-width:420px;margin:32px auto">
    <h1 style="font-size:26px">Anmelden</h1>
    <p class="sub">Mit der E-Mail-Adresse und dem Passwort, die du in Supabase angelegt hast. Die Anmeldung bleibt auf diesem Gerät gespeichert.</p>
    <form id="loginform" class="form">
      <div class="field"><label for="l-mail">E-Mail</label><input id="l-mail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pw">Passwort</label><input id="l-pw" type="password" autocomplete="current-password" required></div>
      <div class="row"><button class="btn primary" type="submit" id="l-go">Anmelden</button></div>
      <p id="loginerr" class="small" style="color:var(--g1);margin:0"></p>
    </form></section>`;
}
document.addEventListener("submit", async e=>{
  if(e.target.id!=="loginform") return;
  e.preventDefault();
  const btn = $("#l-go"), err = $("#loginerr"); btn.disabled = true; err.textContent = "";
  const {data, error} = await S.sb.auth.signInWithPassword({email:$("#l-mail").value.trim(), password:$("#l-pw").value});
  btn.disabled = false;
  if(error || !data.session){ err.textContent = !navigator.onLine ? "Keine Internetverbindung." : /confirm/i.test(error&&error.message||"") ? "Die E-Mail-Adresse ist noch nicht bestätigt." : "E-Mail oder Passwort stimmt nicht."; return; }
  startData(data.session);
});

/* ---------- Ansicht: Heute ---------- */
function vHeute(){
  const all = [...S.items.values()];
  const cats = S.settings.cats;
  const dueBy = t => all.filter(i=>i.type===t && isDue(i)).length;
  const target = todayTarget(), done = doneToday();
  const avail = all.filter(i=>cats.includes(i.type) && isDue(i)).length;
  const n = Math.min(Math.max(0,target-done), avail);
  const leech = all.filter(i=>(S.progress.get(i.id)||{}).leech).length;
  const fixes = all.filter(i=>i.suggestion && i.suggestion.status==="offen").length;
  const example = all.some(i=>i.example);
  if(!all.length) return `<h1>Deine Kartei ist leer</h1><p class="sub">Lege den ersten Eintrag an, lade unter „Daten“ die Sicherung aus deiner alten Kartei oder importiere deine Quizlet-Sets.</p>
    <div class="row"><a class="btn primary" href="#neu">Eintrag anlegen</a><a class="btn" href="#daten">Daten importieren</a></div>`;
  const taDates = [...new Set(all.filter(i=>i.tagesabfrage).map(i=>i.tagesabfrage))].sort().reverse();
  const taCount = d => all.filter(i=>i.tagesabfrage===d).length;
  const taNew = d => all.filter(i=>i.tagesabfrage===d && isNew(i)).length;
  const taRow = d => `<div class="row" style="padding:11px 0;border-top:1px solid var(--line)"><div><b>${toDate(d).toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}</b><div class="small muted">${taCount(d)} Karten${taNew(d)?", "+taNew(d)+" noch nie gelernt":""}</div></div><span class="spacer"></span><button class="btn ${d===taDates[0]?"primary":""}" data-act="tagesabfrage" data-d="${esc(d)}">Abfragen</button></div>`;
  const taShown = taHist ? taDates : taDates.slice(0,2);
  const taBox = `<section class="panel" style="margin-top:18px"><div class="row" style="margin-bottom:4px"><h3 style="margin:0">Lerninhalte von heute abfragen</h3></div><p class="small muted" style="margin:0 0 10px">Claude wertet dreimal täglich aus, welche Dokumente du geändert hast, und macht daraus Karten.</p>${taDates.length ? taShown.map(taRow).join("") : `<div class="small muted" style="border-top:1px solid var(--line);padding-top:11px">Noch keine Abfrage vorhanden. Sie erscheint hier automatisch, sobald Claude deine Änderungen ausgewertet hat.</div>`}${taDates.length>2 ? `<div style="border-top:1px solid var(--line);padding-top:10px"><button class="linkbtn" data-act="tahist">${taHist?"Verlauf ausblenden":"Verlauf anzeigen ("+(taDates.length-2)+" ältere)"}</button></div>`:""}</section>`;
  return `<h1>Heute</h1>
  <p class="sub">${new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}. Ausgewählt wird nach Fälligkeit, Klausurrelevanz und deinem Lernstand.</p>
  ${S.mode==="lokal"?'<div class="notice info small">Noch nicht mit Supabase verbunden. Deine Einträge liegen nur in diesem Browser.</div>':""}
  ${example?'<div class="notice info small">Die Kartei enthält noch Beispielinhalte zum Ausprobieren. Du kannst sie unter „Daten“ löschen, bevor du deine eigenen Karten importierst.</div>':""}
  <div class="today">
    <div><section class="panel">
      <h3 style="margin-top:0">Was möchtest du abfragen?</h3>
      <div class="cats">${TKEYS.map(t=>`<button class="chip t-${t}" data-act="cat" data-t="${t}" aria-pressed="${cats.includes(t)}"><i class="dot"></i>${TYPES_PL[t]} <span class="n">${dueBy(t)}</span></button>`).join("")}</div>
      <h3>Wie viele heute?</h3>
      <div class="slider"><input id="daily" type="range" min="0" max="200" step="5" value="${target}" aria-label="Karten heute"><output id="dailyOut">${target}</output></div>
      <p class="small muted" style="margin:0 0 18px">Grundpensum ${S.settings.base} pro Tag. Der Regler gilt nur für heute. Erledigt: ${done}.</p>
      <div class="row"><button class="btn primary big" data-act="start" ${n?"":"disabled"}>${n ? n+" Karten abfragen" : done>=target && avail ? "Tagespensum geschafft" : "Nichts fällig"}</button>
      ${!n && avail ? `<button class="btn" data-act="more">10 weitere</button>`:""}</div>
      <p class="small muted" style="margin:14px 0 0"><kbd>Leertaste</kbd> Antwort zeigen, <kbd>1</kbd>–<kbd>4</kbd> bewerten, <kbd>?</kbd> alle Tastenkürzel</p>
    </section>
    ${taBox}</div>
    <aside>
      <div class="facts">
        <div><b>${streak()}</b><span>${streak()===1?"Tag":"Tage"} Lernserie</span></div>
        <div><b>${done}</b><span>heute erledigt</span></div>
        <div><b>${avail}</b><span>fällig in deiner Auswahl</span></div>
        <div><b>${all.filter(isNew).length}</b><span>noch nie gelernt</span></div>
      </div>
      ${leech?`<div class="notice fix" style="margin-top:14px"><h4>${leech} Problemkarte${leech>1?"n":""}</h4>Karten, die du immer wieder vergisst. <a href="#problemkarten" class="linkbtn">Ansehen</a></div>`:""}
      ${fixes?`<div class="notice info" style="margin-top:14px"><b>${fixes} Korrekturvorschl${fixes>1?"äge":"ag"}</b> von Claude warten. Sie erscheinen, wenn du die Karte zum ersten Mal lernst. <a class="linkbtn" href="#bibliothek" data-act="fixfilter">Alle zeigen</a></div>`:""}
    </aside>
  </div>`;
}
function streak(){
  let d = today(), n = 0;
  if(!S.log.days[d]) d = addDays(d,-1);
  while(S.log.days[d]){ n++; d = addDays(d,-1); }
  return n;
}
function buildQueue(cats, n){
  return [...S.items.values()].filter(i=>cats.includes(i.type) && isDue(i)).sort((a,b)=>priority(b)-priority(a)).slice(0,n).map(i=>i.id);
}
function startSession(ids, opts={}){
  if(!ids.length){ toast("Keine passenden Karten gefunden."); return; }
  session = {ids, idx:0, revealed:false, exam:!!opts.exam, label:opts.label||"Abfrage", results:{1:0,2:0,3:0,4:0}, counted:new Set(), total:ids.length};
  go("lernen");
}

/* ---------- Ansicht: Lernen ---------- */
function vLernen(){
  if(!session) return `<h1>Keine laufende Abfrage</h1><p class="sub">Starte eine Abfrage unter „Heute“.</p><a class="btn primary" href="#heute">Zu „Heute“</a>`;
  if(session.idx >= session.ids.length){
    const r = session.results, tot = r[1]+r[2]+r[3]+r[4];
    return `<div class="panel done"><b>${tot}</b><p>${session.exam?"Prüfungsfragen beantwortet":"Karten wiederholt"}</p>
      <p class="muted">Nochmal ${r[1]}, schwer ${r[2]}, gut ${r[3]}, leicht ${r[4]}${session.exam&&tot?". Quote: "+Math.round((r[3]+r[4])/tot*100)+" % sicher":""}</p>
      <div class="row" style="justify-content:center;margin-top:16px"><a class="btn primary" href="#heute" data-act="endsession">Fertig</a><a class="btn" href="#statistik" data-act="endsession">Statistik ansehen</a></div></div>`;
  }
  const id = session.ids[session.idx], it = S.items.get(id);
  if(!it){ session.idx++; return vLernen(); }
  const pos = session.idx+1, tot = session.ids.length;
  return `<div class="row"><b>${esc(session.label)}</b><span class="muted">${pos} von ${tot}</span><span class="spacer"></span>
    <button class="btn ghost" data-act="endsession">Beenden</button></div>
  <div class="bar"><i style="width:${(session.idx/tot*100).toFixed(1)}%"></i></div>
  <div class="study">
    <div>${fixNotice(it)}${sheet(it, session.revealed, true)}</div>
    ${chatPanel(it)}
  </div>`;
}
function fixNotice(it){
  const s = it.suggestion; if(!s || s.status!=="offen") return "";
  return `<div class="notice fix"><h4>Korrekturvorschlag von Claude</h4><div class="prose" style="font-size:15px">${paras(s.text)}</div>
    ${s.patch ? `<details class="small" style="margin-top:6px"><summary>Neue Fassung ansehen</summary><div class="prose" style="font-size:14.5px;margin-top:6px">${Object.entries(s.patch).map(([k,v])=>`<p><b>${esc(fieldName(k))}:</b> ${esc(Array.isArray(v)?v.map(x=>typeof x==="object"?x.frage+" ⇒ "+x.antwort:x).join("; "):v)}</p>`).join("")}</div></details>`:""}
    <div class="row">${s.patch?`<button class="btn primary" data-act="fixok" data-id="${esc(it.id)}">Übernehmen</button>`:`<button class="btn primary" data-act="fixok" data-id="${esc(it.id)}">Zur Kenntnis genommen</button>`}<button class="btn" data-act="fixno" data-id="${esc(it.id)}">Verwerfen</button></div></div>`;
}
const fieldName = k => ({steps:"Prüfungspunkte",hinweis:"Hinweise",front:"Vorderseite",back:"Rückseite",term:"Begriff",definition:"Definition",merkmale:"Kernmerkmale",title:"Titel",sachverhalt:"Sachverhalt",kern:"Wesentliche Bestandteile",problems:"Probleme",norms:"Normen"}[k]||k);

function sheet(it, revealed, study){
  const p = S.progress.get(it.id);
  const meta = `<div class="meta"><span class="typetag">${TYPES[it.type]}</span><span>${esc(it.area||"")}</span>${relDots(it.relevance)}<span>${esc(it.source||"")}</span>
    ${study?`<span class="spacer"></span><a href="#e-${esc(it.id)}" class="small muted" data-act="peek">Eintrag öffnen</a>`:""}</div>`;
  let q="", a="";
  if(it.type==="card"){
    q = `<p class="q">${esc(it.front)}</p>`;
    a = `<div class="prose">${paras(it.back)}</div>`;
  } else if(it.type==="def"){
    q = `<p class="small muted" style="margin:0 0 4px">Definiere</p><p class="q">${esc(it.term)}</p>`;
    a = `<div class="prose">${paras(it.definition)}</div>${(it.merkmale||[]).length?`<h3>Kernmerkmale</h3><ul class="kern">${it.merkmale.map(m=>"<li>"+esc(m)+"</li>").join("")}</ul>`:""}`;
  } else if(it.type==="schema"){
    q = `<p class="small muted" style="margin:0 0 4px">Gib das Prüfungsschema wieder</p><p class="q">${esc(it.title)}</p>`;
    a = schemaList(it.steps)+(it.hinweis?`<div class="prose small" style="margin-top:10px;color:var(--muted)">${paras(it.hinweis)}</div>`:"");
  } else {
    q = `<p class="q">${esc(it.title)}</p>${it.sachverhalt?`<div class="prose" style="color:var(--muted);font-size:15.5px">${paras(it.sachverhalt)}</div>`:""}
      ${study?`<p style="margin:14px 0 0;font-weight:600">Was sind die wesentlichen Bestandteile und die Probleme dieses Falls?</p>`:""}`;
    a = `${(it.kern||[]).length?`<h3 style="margin-top:0">Wesentliche Bestandteile</h3><ul class="kern prose" style="font-size:16px">${it.kern.map(k=>"<li>"+esc(k)+"</li>").join("")}</ul>`:""}
      ${(it.problems||[]).length?`<h3>Problemschwerpunkte</h3><ol class="probs prose" style="font-size:16px">${it.problems.map(pr=>`<li><b>${esc(pr.frage)}</b><br>${esc(pr.antwort)}</li>`).join("")}</ol>`:""}`;
  }
  const norms = (it.norms||[]).length ? `<div class="margin-norms">${it.norms.map(n=>`<a class="norm" href="#${normSlug(n)}">${esc(n)}</a>`).join("")}</div>` : "";
  if(!study) return `<article class="sheet t-${it.type}">${meta}${q}<div class="answer">${a}</div>${norms}</article>`;
  // Lernansicht
  let write = "";
  if(it.type==="def" && !session.exam || it.type==="def" && session.exam){
    write = `<div class="row" style="margin-top:16px"><label class="switch"><input type="checkbox" data-act="writemode" ${S.settings.write?"checked":""}> Schreibmodus: Definition eintippen und von Claude auswerten lassen</label></div>`;
    if(S.settings.write && !revealed){
      const v = verdicts.get(it.id);
      write += `<div class="write" style="margin-top:10px"><textarea id="wtext" placeholder="Deine Definition …">${esc(v&&v.input||"")}</textarea>
        <div class="row" style="margin-top:8px"><button class="btn" data-act="judge" data-id="${esc(it.id)}" ${v&&v.busy?"disabled":""}>${v&&v.busy?"Claude wertet aus …":"Auswerten lassen"}</button>
        ${S.ai?"":'<span class="small muted">Die Auswertung braucht die Verbindung zu Supabase.</span>'}</div></div>`;
    }
  }
  const v = verdicts.get(it.id);
  const verdictHtml = v && v.result ? verdictBox(v.result) : v && v.error ? `<div class="verdict small">${esc(v.error)}</div>` : "";
  const rec = v && v.result ? ({"Nochmal":1,"Schwer":2,"Gut":3,"Leicht":4}[v.result.empfehlung]||0) : 0;
  const gradeBtns = [1,2,3,4].map(g=>{
    const ivl = session.exam ? null : schedule(p, g, it.relevance).ivl;
    return `<button data-act="grade" data-g="${g}" class="${rec===g?"rec":""}"><b>${GRADE_TXT[g]}<kbd>${g}</kbd></b><span>${session.exam ? "" : g===1 && (it.relevance||3)>=4 ? "gleich nochmal" : fmtIvl(ivl)}</span></button>`;
  }).join("");
  return `<article class="sheet t-${it.type}">${meta}${q}${write}${verdictHtml}
    ${revealed ? `<div class="answer">${a}</div>${norms}<div class="grades">${gradeBtns}</div>${linkedLine(it)}`
      : `<div class="reveal"><button class="btn primary big" data-act="reveal">Antwort zeigen <kbd style="margin-left:6px">Leertaste</kbd></button></div>`}
  </article>`;
}
function schemaList(steps){
  return `<ol class="schema prose" style="font-size:16px">${(steps||[]).map(l=>{ const lv = Math.min(4, Math.floor((l.match(/^\s*/)[0].replace(/\t/g,"  ").length)/2)); return `<li class="l${lv}" style="--lv:${lv}">${esc(l.trim())}</li>`; }).join("")}</ol>`;
}
function verdictBox(r){
  return `<div class="verdict"><b>${esc(r.gesamt==="vollständig"?"Vollständig erfasst":r.gesamt==="teilweise"?"Teilweise erfasst":"Wesentliches fehlt")}</b>${r.empfehlung?` <span class="small muted">Vorschlag: ${esc(r.empfehlung)}</span>`:""}
    <ul>${(r.merkmale||[]).map(m=>`<li class="${m.erfuellt?"y":"n"}">${esc(m.merkmal)}${m.hinweis?` <span class="muted small">${esc(m.hinweis)}</span>`:""}</li>`).join("")}</ul>
    ${r.kommentar?`<p class="small" style="margin:8px 0 0">${esc(r.kommentar)}</p>`:""}</div>`;
}
function linkedLine(it){
  const l = linksOf(it.id); if(!l.length) return "";
  return `<p class="small muted" style="margin:16px 0 0">Verknüpft: ${l.slice(0,6).map(o=>`<a href="#e-${esc(o.id)}" data-act="peek">${esc(TYPES[o.type])}: ${esc(titleOf(o))}</a>`).join(", ")}${l.length>6?" und "+(l.length-6)+" weitere":""}</p>`;
}
async function grade(g){
  if(!session || !session.revealed) return;
  const id = session.ids[session.idx], it = S.items.get(id);
  session.results[g]++;
  if(!session.exam){
    const p = schedule(S.progress.get(id), g, it.relevance);
    putProgress(id, p);
    if(!session.counted.has(id)){ session.counted.add(id); bumpLog(); }
    if(g===1 && (it.relevance||3)>=4){ const at = Math.min(session.ids.length, session.idx+4); session.ids.splice(at,0,id); }
  }
  verdicts.delete(id);
  session.idx++; session.revealed = false;
  render();
}

/* ---------- KI: Auswertung & Chat ---------- */
function itemContext(it){
  const L = [`Typ: ${TYPES[it.type]}`, `Rechtsgebiet: ${it.area||"-"}`, `Quelle: ${it.source||"-"}`, `Normen: ${(it.norms||[]).join(", ")||"-"}`];
  if(it.type==="card") L.push("Frage (Vorderseite): "+it.front, "Antwort (Rückseite): "+it.back);
  if(it.type==="def") L.push("Begriff: "+it.term, "Definition: "+it.definition, "Kernmerkmale: "+(it.merkmale||[]).join("; "));
  if(it.type==="schema") L.push("Schema: "+it.title, "Prüfungspunkte:\n"+(it.steps||[]).join("\n"), "Hinweise: "+(it.hinweis||"-"));
  if(it.type==="case") L.push("Fall: "+it.title, "Sachverhalt: "+(it.sachverhalt||"-"), "Wesentliche Bestandteile: "+(it.kern||[]).join("; "), "Probleme: "+(it.problems||[]).map(p=>p.frage+" => "+p.antwort).join(" | "));
  return L.join("\n");
}
async function judge(id){
  const it = S.items.get(id); const ta = $("#wtext"); const input = (ta && ta.value || "").trim();
  if(!input){ toast("Schreib zuerst deine Definition."); return; }
  if(!S.ai){ toast("Die Auswertung braucht die Verbindung zu Supabase."); return; }
  verdicts.set(id, {input, busy:true}); render();
  const prompt = `Begriff: ${it.term}
Musterdefinition: ${it.definition}
Kernmerkmale: ${(it.merkmale||[]).join("; ")||"(aus der Musterdefinition ableiten)"}
Antwort: ${input}`;
  const key = "g:"+hashStr(it.term+"|"+it.definition+"|"+(it.merkmale||[]).join("|"))+":"+hashStr(normQ(input));
  const hit = cacheGet(key);
  if(hit){ verdicts.set(id, {input, result:hit}); }
  else try{
    const r = await aiJson(prompt);
    verdicts.set(id, {input, result:r}); cachePut(key, r);
  }catch(e){
    verdicts.set(id, {input, error: errText(e)});
  }
  if(session && session.ids[session.idx]===id){ session.revealed = true; }
  if(route()==="lernen") render();
}
function errText(e){
  const c = e && e.code;
  if(c==="offline" || c==="network") return "Keine Verbindung. Prüfe dein Internet und versuch es noch einmal.";
  if(c==="auth") return "Deine Anmeldung ist abgelaufen. Lade die Seite neu und melde dich an.";
  if(c==="forbidden") return "Dieses Konto darf Claude nicht nutzen (ALLOWED_EMAIL in Supabase prüfen).";
  if(c==="no_function") return "Die Claude-Funktion ist in Supabase noch nicht eingerichtet (Anleitung, Schritt 4).";
  if(c==="no_key") return "In Supabase fehlt noch der Anthropic-API-Schlüssel (Secret ANTHROPIC_API_KEY).";
  if(c==="bad_key") return "Der Anthropic-API-Schlüssel wird nicht akzeptiert. Prüf das Secret in Supabase.";
  if(c==="no_credit") return "Dein API-Guthaben ist aufgebraucht. Lade es in der Anthropic-Konsole auf.";
  if(c==="rate_limited") return "Gerade zu viele Anfragen. Warte einen Moment und versuch es dann erneut.";
  if(c==="cancelled") return "Abgebrochen.";
  if(c==="invalid_json") return "Die Auswertung kam unvollständig zurück. Versuch es noch einmal.";
  return "Claude hat nicht geantwortet. Versuch es noch einmal.";
}
function chatPanel(it){
  const c = chats.get(it.id) || {turns:[]};
  const msgs = c.turns.map(t=>`<div class="msg ${t.role==="user"?"u":"a"}">${esc(t.content)}</div>`).join("")
    + (c.busy ? `<div class="msg a" id="streaming">${esc(c.partial||"Denkt nach …")}</div>` : "")
    + (c.error ? `<div class="msg err">${esc(c.error)}</div>` : "");
  const starters = !c.turns.length && !c.busy ? `<div class="starters">
      <button data-act="ask" data-q="Erklär mir das an einem kurzen Beispiel.">Beispiel</button>
      <button data-act="ask" data-q="Wie baue ich das in der Klausur ein, und wo liegen typische Fehler?">Klausuraufbau</button>
      <button data-act="ask" data-q="Welche Streitstände gibt es hierzu, kurz mit herrschender Meinung?">Streitstände</button>
      <button data-act="ask" data-q="Stell mir eine Anschlussfrage zum Thema.">Anschlussfrage</button></div>` : "";
  return `<aside class="chat" data-chat="${esc(it.id)}">
    <header><b>Nachfragen bei Claude</b><span>Claude kennt den Inhalt ${({def:"dieser Definition",card:"dieser Karteikarte",schema:"dieses Schemas",case:"dieses Falls"})[it.type]}. ${S.ai?"":"Erst nach der Anmeldung verfügbar."}</span></header>
    <div class="msgs">${msgs || ""}${starters}${!c.turns.length&&!c.busy?'<p class="small" style="opacity:.7;margin:0">Frag nach, wenn etwas unklar ist. Claude bekommt die Karte und deine letzten Nachrichten; gleiche Fragen beantwortet die App aus dem Speicher.</p>':""}</div>
    <div class="compose"><textarea id="chatin" rows="1" placeholder="Frage zur Karte …" ${S.ai?"":"disabled"}></textarea>
      ${c.busy?`<button class="btn" data-act="stop">Stopp</button>`:`<button class="btn" data-act="send" ${S.ai?"":"disabled"}>Senden</button>`}</div>
  </aside>`;
}
function rerenderChat(id){
  const el = document.querySelector(`.chat[data-chat="${CSS.escape(id)}"]`); if(!el) return;
  const typed = ($("#chatin")||{}).value || ""; const focused = document.activeElement && document.activeElement.id==="chatin";
  const tmp = document.createElement("div"); tmp.innerHTML = chatPanel(S.items.get(id)); el.replaceWith(tmp.firstElementChild);
  const ta = $("#chatin"); if(ta){ ta.value = typed; if(focused) ta.focus(); }
  afterRender();
}
async function sendChat(id, text){
  text = (text||"").trim(); if(!text || !S.ai) return;
  const it = S.items.get(id); const c = chats.get(id) || {turns:[]}; chats.set(id,c);
  if(c.busy) return;
  c.turns.push({role:"user", content:text}); c.busy = true; c.partial = ""; c.error = null; c.ctl = new AbortController();
  const ta = $("#chatin"); if(ta) ta.value = "";
  rerenderChat(id);
  const ctx = "Die Karte, um die es geht:\n"+itemContext(it);
  const first = c.turns.length===1;
  const key = first ? "c:"+hashStr(ctx)+":"+hashStr(normQ(text)) : null;
  const hit = key && cacheGet(key);
  if(hit){ c.turns.push({role:"assistant", content:hit}); }
  else try{
    const res = await aiStream([CHAT_RULES, ctx], c.turns, {signal:c.ctl.signal,
      onText:text=>{ c.partial = text; const s = $("#streaming"); if(s){ s.textContent = text; const m=s.parentElement; m.scrollTop=m.scrollHeight; } }});
    c.turns.push({role:"assistant", content:res});
    if(key && res) cachePut(key, res);
  }catch(e){
    if(e && e.text) c.turns.push({role:"assistant", content:e.text});
    if(!(e && e.code==="cancelled")) c.error = errText(e);
  }
  c.busy = false; c.partial = "";
  rerenderChat(id);
}

let searchQ = "";
function vSuche(){
  return `<h1>Suche</h1><p class="sub">Durchsucht Begriffe, Inhalte, Schlagwörter und Normen aller Definitionen, Karteikarten, Schemata und Fälle.</p>

}
function runSearch(){
  const box = $("#results"); if(!box) return;
  const toks = fold(searchQ).split(/\s+/).filter(Boolean);
  if(!toks.length){ box.innerHTML = `<p class="muted">Tipp ein Wort ein. Mehrere Wörter müssen alle vorkommen.</p>${tagCloud()}`; return; }
  const hits = [...S.items.values()].filter(it=>{ const h = hay(it); return toks.every(t=>h.includes(t)); })
    .sort((a,b)=>{ const ta=fold(titleOf(a)), tb=fold(titleOf(b)); const sa=toks.some(t=>ta.includes(t))?1:0, sb=toks.some(t=>tb.includes(t))?1:0; return sb-sa || (b.relevance||3)-(a.relevance||3); });
  if(!hits.length){ box.innerHTML = `<div class="panel empty">Kein Treffer für „${esc(searchQ)}“. Prüf die Schreibweise oder such nach einer Norm.</div>`; return; }
  box.innerHTML = TKEYS.map(t=>{ const h = hits.filter(i=>i.type===t); if(!h.length) return "";
    return `<h3>${TYPES_PL[t]} <span class="muted">${h.length}</span></h3><div class="list">${h.slice(0,80).map(i=>itemRow(i,toks)).join("")}</div>`; }).join("");
}
function tagCloud(){
  const m = new Map(); for(const it of S.items.values()) for(const t of (it.tags||[])) m.set(t,(m.get(t)||0)+1);
  if(!m.size) return "";
  return `<h3>Schlagwörter</h3><div class="row" style="gap:6px">${[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,40).map(([t,n])=>`<button class="tag" data-act="tag" data-t="${esc(t)}">${esc(t)} ${n}</button>`).join("")}</div>`;
}

let editType = "card", draftLinksInit = false;
function linkChips(){ return draftLinks.map(id=>{ const o=S.items.get(id); return o?`<span>${esc(TYPES[o.type])}: ${esc(titleOf(o).slice(0,50))}<button data-act="unlink" data-id="${esc(id)}" aria-label="Entfernen">×</button></span>`:""; }).join(""); }
const lines = id => ($("#"+id)?.value||"").split("\n").map(s=>s.trim()).filter(Boolean);
const csv = id => ($("#"+id)?.value||"").split(",").map(s=>s.trim()).filter(Boolean);
async function saveEdit(){
  const f = $("#editform"); const id = f.dataset.id; const old = id ? S.items.get(id) : null;
  const type = old ? old.type : editType;
  const it = old ? clean(old) : {id: uid({def:"d",case:"f",schema:"s",card:"k"}[type]), type, created:new Date().toISOString()};
  if(type==="card"){ it.front = $("#f-front").value.trim(); it.back = $("#f-back").value.trim(); if(!it.front){ toast("Die Vorderseite fehlt."); return; } }
  if(type==="def"){ it.term = $("#f-term").value.trim(); it.definition = $("#f-definition").value.trim(); it.merkmale = lines("f-merkmale"); if(!it.term){ toast("Der Begriff fehlt."); return; } }
  if(type==="schema"){ it.title = $("#f-title").value.trim(); it.steps = ($("#f-steps").value||"").split("\n").map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim()); it.hinweis = $("#f-hinweis").value.trim(); if(!it.title){ toast("Der Titel fehlt."); return; } }
  if(type==="case"){ it.title = $("#f-title").value.trim(); it.sachverhalt = $("#f-sachverhalt").value.trim(); it.kern = lines("f-kern");
    it.problems = lines("f-problems").map(l=>{ const i=l.indexOf("=>"); return i<0?{frage:l,antwort:""}:{frage:l.slice(0,i).trim(),antwort:l.slice(i+2).trim()}; });
    if(!it.title){ toast("Der Titel fehlt."); return; } }
  it.area = $("#f-area").value.trim(); it.source = $("#f-source").value.trim(); it.norms = csv("f-norms"); it.tags = csv("f-tags");
  it.relevance = Number($("#f-rel").value)||3; it.links = [...new Set(draftLinks)].filter(x=>x!==it.id);
  await putItem(it);
  // Verweise beidseitig halten
  const prevLinks = old ? (old.links||[]) : [];
  for(const lid of it.links){ const o = S.items.get(lid); if(o && !(o.links||[]).includes(it.id)){ o.links = [...(o.links||[]), it.id]; await putItem(o); } }
  for(const lid of prevLinks.filter(x=>!it.links.includes(x))){ const o = S.items.get(lid); if(o && (o.links||[]).includes(it.id)){ o.links = o.links.filter(x=>x!==it.id); await putItem(o); } }
  editing = null; draftLinksInit = false; toast(old?"Gespeichert":"Angelegt"); go("e-"+it.id);
}

/* ---------- Ansicht: Normen ---------- */
function vNormen(){
  const idx = normIndex();
  const groups = new Map();
  for(const [n,list] of idx){ const law = (n.match(/([A-ZÄÖÜ][A-Za-zÄÖÜäöü]*)\s*$/)||[,"Sonstige"])[1]; if(!groups.has(law)) groups.set(law,[]); groups.get(law).push([n,list]); }
  const num = n => parseFloat((n.match(/\d+[a-z]?/)||["0"])[0]) || 0;
  return `<h1>Normen</h1><p class="sub">Jede Norm bündelt alle Definitionen, Karteikarten, Schemata und Fälle, in denen sie vorkommt.</p>
  ${idx.size ? [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0],"de")).map(([law,arr])=>`<h2>${esc(law)}</h2><div class="row" style="gap:8px">${arr.sort((a,b)=>num(a[0])-num(b[0])).map(([n,l])=>`<a class="norm" style="font-size:14px;padding:7px 10px" href="#${normSlug(n)}">${esc(n)} <span style="opacity:.6">${l.length}</span></a>`).join("")}</div>`).join("") : `<div class="panel empty">Noch keine Normen hinterlegt.</div>`}`;
}
function vNorm(slug){
  const idx = normIndex(); let name = null, list = [];
  for(const [n,l] of idx) if(normSlug(n)===slug){ name = n; list = l; break; }
  if(!name) return `<h1>Norm nicht gefunden</h1><a class="btn" href="#normen">Alle Normen</a>`;
  const by = t => list.filter(i=>i.type===t);
  return `<div class="crumbs"><a href="#normen">Normen</a></div><div class="row"><h1>${esc(name)}</h1><span class="spacer"></span><button class="btn primary" data-act="learnnorm" data-n="${esc(slug)}">Alles zu dieser Norm abfragen</button></div>
  <p class="sub">${list.length} Einträge</p>
  ${TKEYS.map(t=>by(t).length?`<h3>${TYPES_PL[t]}</h3><div class="list">${by(t).map(i=>itemRow(i)).join("")}</div>`:"").join("")}`;
}

function examPool(){ return [...S.items.values()].filter(i=>exam.cats.includes(i.type) && (!exam.area||i.area===exam.area) && (i.relevance||3)>=exam.minRel); }

/* ---------- Ansicht: Statistik ---------- */
function vStats(){
  const all = [...S.items.values()];
  const ar = areas(); if(all.some(i=>!i.area)) ar.push("");
  const t = today();
  const fc = []; for(let d=0; d<14; d++){ const day = addDays(t,d); fc.push(all.filter(i=>{ const p=S.progress.get(i.id); return d===0 ? (!p || p.due<=t) : p && p.due===day; }).length); }
  const max = Math.max(1,...fc);
  const reviews = Object.values(S.log.days).reduce((a,b)=>a+b,0);
  const last30 = []; for(let d=29; d>=0; d--) last30.push(S.log.days[addDays(t,-d)]||0);
  const max30 = Math.max(1,...last30);
  return `<h1>Statistik</h1><p class="sub">${reviews} Wiederholungen insgesamt. Lernserie: ${streak()} ${streak()===1?"Tag":"Tage"}.</p>
  <div class="grid2">
    <section class="panel"><h3 style="margin-top:0">Fällig in den nächsten 14 Tagen</h3>
      <div class="forecast">${fc.map((n,d)=>`<div><em>${n}</em><i style="height:${(n/max*100).toFixed(0)}%"></i><span>${d===0?"heute":toDate(addDays(t,d)).toLocaleDateString("de-DE",{weekday:"short"}).replace(".","")}</span></div>`).join("")}</div>
      <p class="small muted" style="margin:10px 0 0">„Heute“ enthält alle noch nie gelernten Einträge.</p></section>
    <section class="panel"><h3 style="margin-top:0">Gelernt in den letzten 30 Tagen</h3>
      <div class="forecast" style="gap:2px">${last30.map((n,i)=>`<div title="${n}"><i style="height:${(n/max30*100).toFixed(0)}%;max-width:14px;background:var(--acc-ink)"></i></div>`).join("")}</div></section>
  </div>
  <h2>Fortschritt nach Rechtsgebiet</h2>
  <section class="panel"><div class="areas">${ar.map(a=>{
    const l = all.filter(i=>(i.area||"")===a); const n = l.length||1;
    const neu = l.filter(isNew).length, sicher = l.filter(i=>{const p=S.progress.get(i.id); return p && p.ivl>=21;}).length, prob = l.filter(i=>(S.progress.get(i.id)||{}).leech).length;
    const lern = l.length-neu-sicher-prob;
    return `<div class="area"><div class="row"><b>${esc(a||"Ohne Rechtsgebiet")}</b><span class="small muted">${l.length} ${l.length===1?"Eintrag":"Einträge"}, ${Math.round(sicher/n*100)} % sicher</span></div>
      <div class="stack"><i style="width:${sicher/n*100}%;background:var(--g3)"></i><i style="width:${lern/n*100}%;background:var(--g4)"></i><i style="width:${prob/n*100}%;background:var(--g1)"></i></div></div>`; }).join("")}</div>
    <div class="legend"><span><i style="background:var(--g3)"></i>sicher (Abstand ab 3 Wochen)</span><span><i style="background:var(--g4)"></i>in Arbeit</span><span><i style="background:var(--g1)"></i>Problemkarten</span><span><i style="background:var(--line)"></i>neu</span></div></section>`;
}

/* ---------- Ansicht: Daten ---------- */
function vDaten(){
  const ex = [...S.items.values()].filter(i=>i.example).length;
  return `<h1>Daten</h1><p class="sub">${S.mode==="konto" ? "Deine Kartei liegt in deiner Supabase-Datenbank und ist auf allen deinen Geräten gleich. Sichere sie trotzdem ab und zu als Datei." : "Noch nicht mit Supabase verbunden: Die Kartei liegt nur in diesem Browser. Trag deine Zugangsdaten in config.js ein (Anleitung, Schritt 5)."}${S.stale?" Die Verbindung zur Datenbank hakt gerade; Angezeigtes ist eventuell nicht aktuell.":""}</p>
  <div class="grid2">
    ${S.user?`<section class="panel"><h3 style="margin-top:0">Konto</h3><p class="small muted">Angemeldet als ${esc(S.user.email||"")}.</p>
      <div class="row"><button class="btn" data-act="reload">Neu laden</button><button class="btn ghost" data-act="logout">Abmelden</button></div></section>`:""}
    <section class="panel"><h3 style="margin-top:0">Sichern</h3><p class="small muted">Lädt Karten, Lernstand und Einstellungen als JSON-Datei herunter.</p>
      <button class="btn" data-act="export">Als Datei sichern</button><div id="exportbox"></div></section>
    <section class="panel"><h3 style="margin-top:0">Sicherung laden</h3><p class="small muted">Gleiche Einträge werden überschrieben, alle anderen bleiben erhalten.</p>
      <input type="file" id="importfile" accept=".json,application/json"></section>
    <section class="panel"><h3 style="margin-top:0">Grundpensum</h3><p class="small muted">So viele Karten schlägt „Heute“ jeden Tag vor.</p>
      <div class="slider"><input type="range" min="10" max="200" step="5" value="${S.settings.base}" data-act="base" aria-label="Grundpensum"><output id="baseOut">${S.settings.base}</output></div></section>
    ${ex?`<section class="panel"><h3 style="margin-top:0">Beispielinhalte</h3><p class="small muted">${ex} Einträge sind nur zum Ausprobieren da. Lösch sie, bevor du deine eigenen Karten importierst.</p><button class="btn" data-act="delexamples">Beispielinhalte löschen</button></section>`:""}
  </div>
  <h2>Quizlet-Text einfügen</h2>
  <section class="panel" style="max-width:820px">
    <p class="small muted" style="margin-top:0">In Quizlet: Set öffnen, „Exportieren“, Trennung Begriff/Definition „Tab“, zwischen Karten „Neue Zeile“. Den Text hier einfügen.</p>
    <div class="field"><textarea id="qz" style="min-height:160px;font-family:var(--sans);font-size:14px" placeholder="Begriff	Definition"></textarea></div>
    <div class="two" style="margin-top:10px">
      <div class="field"><label for="qz-type">Anlegen als</label><select id="qz-type"><option value="card">Karteikarten</option><option value="def">Definitionen</option></select></div>
      <div class="field"><label for="qz-area">Rechtsgebiet</label><input id="qz-area" list="arealist2"><datalist id="arealist2">${areas().map(a=>`<option value="${esc(a)}">`).join("")}</datalist></div>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="quizlet">Importieren</button><span class="small muted">Klausurrelevanz, Normen und Verknüpfungen ergänzt Claude später beim Import im Chat.</span></div>
  </section>`;
}
async function doExport(){
  const data = JSON.stringify({app:"examenskartei", version:1, exported:now(), items:[...S.items.values()], progress:Object.fromEntries(S.progress), settings:S.settings, log:S.log}, null, 1);
  const name = "examenskartei-"+today()+".json";
  const mobile = /iPhone|iPad|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Mac/.test(navigator.platform||""));
  try{
    const file = new File([data], name, {type:"application/json"});
    if(mobile && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e && e.name==="AbortError") return; }
    }
    const url = URL.createObjectURL(file); const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000); toast("Gesichert"); return;
  }catch(e){}
  $("#exportbox").innerHTML = `<p class="small muted">Das Herunterladen ist hier nicht möglich. Kopiere den Text und speichere ihn als „${name}“.</p><textarea style="width:100%;min-height:120px;font-size:12px" readonly>${esc(data)}</textarea>`;
}
async function doImport(file, noStart){
  let d;
  try{ d = JSON.parse(await file.text()); if(!Array.isArray(d.items)) throw 0; }
  catch(e){ toast("Die Datei ist keine Sicherung der Examenskartei."); return; }
  try{
    toast("Importiere "+d.items.length+" Einträge …");
    await putItems(d.items.filter(it=>it && it.id && it.type));
    await putProgressMany(Object.entries(d.progress||{}));
    if(d.settings){ Object.assign(S.settings, d.settings); await saveSettings(); }
    if(d.log && d.log.days){ Object.entries(d.log.days).forEach(([k,v])=>S.log.days[k]=Math.max(S.log.days[k]||0,v)); await putMeta("log", S.log); }
    if(d.tagesabfrage && d.tagesabfrage.datum){
      const ids = d.items.filter(it=>it && it.id && it.type).map(it=>it.id);
      toast(ids.length+" Karten der Tagesabfrage übernommen");
      if(noStart){ render(); return; }
      startSession(ids, {label:"Tagesabfrage "+toDate(d.tagesabfrage.datum).toLocaleDateString("de-DE",{day:"numeric",month:"long"})});
      return;
    }
    toast(d.items.length+" Einträge geladen"); render();
  }catch(e){ render(); }
}
async function doQuizlet(){
  const txt = $("#qz").value; const type = $("#qz-type").value; const area = $("#qz-area").value.trim();
  const rows = txt.split(/\r?\n/).map(l=>l.split("\t")).filter(r=>r.length>=2 && r[0].trim());
  if(!rows.length){ toast("Keine Karten erkannt. Zwischen Begriff und Definition muss ein Tab stehen."); return; }
  const list = rows.map(([a,...b])=>{
    const back = b.join(" ").trim();
    const it = type==="def" ? {id:uid("d"), type, term:a.trim(), definition:back, merkmale:[]} : {id:uid("k"), type, front:a.trim(), back};
    return Object.assign(it, {area, source:"Quizlet", relevance:3, norms:[], tags:[], links:[], created:now()});
  });
  try{ await putItems(list); $("#qz").value = ""; toast(rows.length+" Karten importiert"); }catch(e){}
  render();
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if(a==="cat"){ const t=b.dataset.t, c=S.settings.cats; S.settings.cats = c.includes(t) ? c.filter(x=>x!==t) : [...c,t]; saveSettings(); render(); }
  else if(a==="start"){ const n = Math.max(0, todayTarget()-doneToday()); startSession(buildQueue(S.settings.cats, n), {label:"Heutige Abfrage"}); }
  else if(a==="more"){ startSession(buildQueue(S.settings.cats, 10), {label:"Zusätzliche Runde"}); }
  else if(a==="tahist"){ taHist = !taHist; render(); }
  else if(a==="tagesabfrage"){ const d = b.dataset.d; startSession([...S.items.values()].filter(i=>i.tagesabfrage===d).sort((x,y)=>priority(y)-priority(x)).map(i=>i.id), {label:"Tagesabfrage "+toDate(d).toLocaleDateString("de-DE",{day:"numeric",month:"long"})}); }
  else if(a==="reveal"){ if(session){ session.revealed = true; render(); } }
  else if(a==="grade"){ grade(Number(b.dataset.g)); }
  else if(a==="endsession"){ session = null; if(b.tagName!=="A") go("heute"); }
  else if(a==="writemode"){ S.settings.write = b.checked; saveSettings(); render(); }
  else if(a==="judge"){ judge(id); }
  else if(a==="fixok"||a==="fixno"){ const it = S.items.get(id); if(!it||!it.suggestion) return;
    const c = clean(it); if(a==="fixok" && c.suggestion.patch) Object.assign(c, c.suggestion.patch);
    c.suggestion.status = a==="fixok" ? "übernommen" : "verworfen"; c.suggestion.decided = today(); await putItem(c); toast(a==="fixok"?"Vorschlag übernommen":"Vorschlag verworfen"); render(); }
  else if(a==="send"){ const box = e.target.closest(".chat"); sendChat(box.dataset.chat, $("#chatin").value); }
  else if(a==="ask"){ const box = e.target.closest(".chat"); sendChat(box.dataset.chat, b.dataset.q); }
  else if(a==="stop"){ const box = e.target.closest(".chat"); const c = chats.get(box.dataset.chat); if(c&&c.ctl) c.ctl.abort(); }
  else if(a==="tag"){ searchQ = b.dataset.t; go("suche"); }
  else if(a==="fixfilter"){ bib.fix = true; }
  else if(a==="learnone"){ const it = S.items.get(id); startSession([id], {label:TYPES[it.type]+" abfragen"}); }
  else if(a==="learnleech"){ startSession([...S.items.values()].filter(i=>(S.progress.get(i.id)||{}).leech).map(i=>i.id), {label:"Problemkarten"}); }
  else if(a==="learnnorm"){ const slug = b.dataset.n; let list=[]; for(const [n,l] of normIndex()) if(normSlug(n)===slug) list=l; startSession(list.sort((x,y)=>priority(y)-priority(x)).map(i=>i.id), {label:"Norm abfragen"}); }
  else if(a==="edit"){ editing = id; draftLinksInit = false; render(); }
  else if(a==="canceledit"){ const was = editing; editing = null; draftLinksInit = false; if(was) render(); else history.length>1 ? history.back() : go("bibliothek"); }
  else if(a==="save"){ saveEdit(); }
  else if(a==="etype"){ editType = b.dataset.t; render(); }
  else if(a==="unlink"){ draftLinks = draftLinks.filter(x=>x!==id); $("#linkchips").innerHTML = linkChips(); }
  else if(a==="addlink"){ if(!draftLinks.includes(id)) draftLinks.push(id); $("#linkchips").innerHTML = linkChips(); $("#f-link").value=""; $("#linkdrop").hidden = true; $("#f-link").focus(); }
  else if(a==="resetp"){ if(confirm("Lernstand dieses Eintrags zurücksetzen?")){ await deleteProgress(id); render(); } }
  else if(a==="logout"){ if(confirm("Auf diesem Gerät abmelden?")){ await S.sb.auth.signOut(); } }
  else if(a==="reload"){ try{ await loadAll(); toast("Aktualisiert"); }catch(e){ toast("Laden fehlgeschlagen."); } render(); }
  else if(a==="del"){ const it=S.items.get(id); if(confirm("„"+titleOf(it)+"“ endgültig löschen?")){ await deleteItem(id); toast("Gelöscht"); go("bibliothek"); } }
  else if(a==="excat"){ const t=b.dataset.t; exam.cats = exam.cats.includes(t)?exam.cats.filter(x=>x!==t):[...exam.cats,t]; render(); }
  else if(a==="startexam"){ const pool = examPool().sort(()=>Math.random()-0.5).slice(0,exam.n); startSession(pool.map(i=>i.id), {exam:true, label:"Prüfungsmodus"}); }
  else if(a==="export"){ doExport(); }
  else if(a==="quizlet"){ doQuizlet(); }
  else if(a==="delexamples"){ const ex=[...S.items.values()].filter(i=>i.example); if(confirm(ex.length+" Beispielinhalte löschen? Dein Lernstand dazu wird ebenfalls entfernt.")){ for(const it of ex) await deleteItem(it.id); toast("Beispielinhalte gelöscht"); render(); } }
  else if(a==="help"){ help(); }
  else if(a==="theme"){ cycleTheme(); }
  else if(a==="closehelp"){ $("#layer").innerHTML=""; }
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.id==="daily"){ $("#dailyOut").textContent = t.value; clearTimeout(t._tm); t._tm = setTimeout(()=>{ S.settings.todayDate = today(); S.settings.todayN = Number(t.value); saveSettings(); render(); }, 350); }
  else if(t.dataset.act==="base"){ $("#baseOut").textContent = t.value; clearTimeout(t._tm); t._tm = setTimeout(()=>{ S.settings.base = Number(t.value); saveSettings(); }, 350); }
  else if(t.id==="bigq"){ searchQ = t.value; runSearch(); }
  else if(t.id==="quick"){ searchQ = t.value; if(route()!=="suche") go("suche"); else { const i=$("#bigq"); if(i) i.value=searchQ; runSearch(); } }
  else if(t.dataset.bib==="q"){ bib.q = t.value; clearTimeout(t._tm); t._tm=setTimeout(()=>{ render(); const i=document.querySelector('[data-bib="q"]'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },250); }
  else if(t.dataset.ex==="n"){ exam.n = Number(t.value); $("#exOut").textContent = t.value; }
  else if(t.id==="f-link"){ const toks = fold(t.value).split(/\s+/).filter(Boolean); const d = $("#linkdrop");
    if(!toks.length){ d.hidden = true; return; }
    const hits = [...S.items.values()].filter(i=>{ const h=fold(titleOf(i)+" "+(i.norms||[]).join(" ")+" "+(i.tags||[]).join(" ")); return toks.every(x=>h.includes(x)) && !draftLinks.includes(i.id) && i.id!==$("#editform").dataset.id; }).slice(0,12);
    d.innerHTML = hits.length ? hits.map(i=>`<button data-act="addlink" data-id="${esc(i.id)}">${esc(TYPES[i.type])}: ${esc(titleOf(i))}</button>`).join("") : '<div class="small muted" style="padding:8px 12px">Kein Treffer</div>'; d.hidden = false; }
  else if(t.id==="chatin"){ t.style.height="auto"; t.style.height=Math.min(140,t.scrollHeight)+"px"; }
});
document.addEventListener("change", async e=>{
  const t = e.target;
  if(t.dataset.bib){ if(t.dataset.bib==="fix") bib.fix = t.checked; else if(t.dataset.bib!=="q") bib[t.dataset.bib] = t.value; render(); }
  else if(t.dataset.ex==="area"){ exam.area = t.value; render(); }
  else if(t.dataset.ex==="minRel"){ exam.minRel = Number(t.value); render(); }
  else if((t.id==="importfile") && t.files[0]){ for(const f of t.files){ await doImport(f); } }
});
document.addEventListener("keydown", e=>{
  const ae = document.activeElement; const typing = ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="f"){ e.preventDefault(); if(route()!=="suche") go("suche"); else { const i=$("#bigq"); i&&i.focus(); i&&i.select(); } return; }
  if(ae && ae.id==="chatin" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); const box = ae.closest(".chat"); sendChat(box.dataset.chat, ae.value); return; }
  if(e.key==="Escape"){ if($("#layer").innerHTML){ $("#layer").innerHTML=""; return; } if(typing){ ae.blur(); return; } }
  if(typing || e.ctrlKey || e.metaKey || e.altKey) return;
  const r = route();
  if(r==="lernen" && session && session.idx<session.ids.length){
    if((e.key===" "||e.key==="Enter") && !session.revealed){ e.preventDefault(); session.revealed=true; render(); return; }
    if(session.revealed && /^[1-4]$/.test(e.key)){ e.preventDefault(); grade(Number(e.key)); return; }
    if(e.key==="w" && !session.revealed){ const ta=$("#wtext"); if(ta){ e.preventDefault(); ta.focus(); } return; }
  }
  if(e.key==="k"){ const c=$("#chatin"); if(c && !c.disabled){ e.preventDefault(); c.focus(); } return; }
  if(e.key==="/"){ e.preventDefault(); go("suche"); return; }
  if(e.key==="?"){ help(); return; }
  if(e.key==="d"){ cycleTheme(); return; }
  const nav = {h:"heute", b:"bibliothek", n:"normen", p:"pruefung", s:"statistik"}[e.key];
  if(nav && r!=="lernen"){ go(nav); }
});

let toastT;
function toast(msg){ let t = $(".toast"); if(!t){ t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 2600); }

/* ---------- Start ---------- */
async function startData(sess){
  S.user = sess.user; S.needLogin = false; S.ready = false; render();
  try{ await loadAll(); }
  catch(e){ S.stale = true; toast(isAuthErr(e) ? "Deine Anmeldung ist abgelaufen. Bitte melde dich neu an." : "Die Kartei konnte nicht geladen werden. Prüfe die Internetverbindung."); }
  S.ai = true; S.ready = true; render(); subscribe();
}
async function boot(){
  render();
  if(!CONFIGURED || !window.supabase){
    S.mode = "lokal"; lsLoad(); S.ready = true; render();
    if(CONFIGURED) toast("Die Datenbank-Bibliothek konnte nicht geladen werden. Prüfe die Internetverbindung.");
    return;
  }
  S.mode = "konto";
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}});
  S.sb.auth.onAuthStateChange((ev)=>{
    if(ev==="SIGNED_OUT"){ S.user = null; S.ai = false; S.items = new Map(); S.progress = new Map(); session = null; S.needLogin = true; S.ready = true; render(); }
  });
  const {data} = await S.sb.auth.getSession();
  if(!data || !data.session){ S.needLogin = true; S.ready = true; render(); return; }
  await startData(data.session);
  document.addEventListener("visibilitychange", async ()=>{
    if(document.visibilityState!=="visible" || !S.user || Date.now()-lastLoad < 30000) return;
    try{ await loadAll(); refresh(); }catch(e){}
  });
}
boot();
